services:
  message-manager:
    build: .
    container_name: message-manager
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_PATH: /app/data/messages.db
      PYTHONDONTWRITEBYTECODE: "1"
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

networks:
  gateway:
    external: true
    name: host-nginx_default
